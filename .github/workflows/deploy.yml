# Simple, robust GitHub Actions workflow to build and deploy a React Vite static site to GitHub Pages
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main      # Change this to "master" if your default branch is master
  workflow_dispatch: # Allows you to manually trigger the deployment from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow clean deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Build output directory to host

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    
