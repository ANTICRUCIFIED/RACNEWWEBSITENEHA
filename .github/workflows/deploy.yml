name: Build & Validate Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Prevent concurrent runs on the same branch from queueing up unnecessarily
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type-Check & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches node_modules to make runs blisteringly fast

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: ⚙️ Run Type-Checking (TypeScript Compiler)
        run: npm run lint

      - name: 🚀 Verify Production Build
        run: npm run build
