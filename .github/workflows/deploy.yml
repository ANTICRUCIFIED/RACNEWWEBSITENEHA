name: Production Deployment to Vercel

on:
  push:
    branches:
      - main  # Triggers the workflow when code is pushed to your default main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Audit Cleanliness & Type Validation
        run: npm run lint

      - name: Run Build Compilation
        run: npm run build
        env:
          NODE_ENV: production
          # If your background build script requires compiling/scraping with API access:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy Production Draft to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod' # Instructs Vercel to label it as the canonical production release
