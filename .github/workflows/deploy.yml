# .github/workflows/deploy.yml
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to trigger the deployment manually from the Actions tab

# Set permissions for the built-in GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in-progress for efficiency
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies (Resilient Fallback)
        # Tries strict clean-install first; if lockfile is out of sync, falls back gracefully to a standard install
        run: npm ci || npm install

      - name: Run Typings Code Validation
        run: npm run lint

      - name: Build Project Assets
        run: npm run build
        env:
          VITE_APP_ENV: production

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Static Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages Engine
        id: deployment
        uses: actions/deploy-pages@v4
