# .github/workflows/deploy.yml
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

# Explicitly grant write access to push to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Explicitly pins Node.js 20 to maintain high stability
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema Consistency & Type Checks
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_APP_ENV: production

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.racforge.com # Automatically maintains your custom domain setting!
