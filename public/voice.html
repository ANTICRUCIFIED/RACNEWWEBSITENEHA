<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] justify-between overflow-hidden select-none relative">

  <!-- ================= SCREEN 1: THE NATIVE MOBILE DIAL PAD (WHITE THEME & SCALED) ================= -->

        <button onclick="dialNum('8')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">8</button>

    <!-- Active Call Footer Actions -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl mb-2 space-y-3">
      <div class="grid grid-cols-2 gap-2">

        <a href="https://cal.id/rac-forge/30-minutes-paid-call" target="_blank" class="p-2.5 bg-teal-900/40 hover:bg-teal-900/60 border border-teal-800 text-center rounded-lg text-[11px] font-bold text-teal-300 transition">💎 Paid 30-Min</a>

      <button onclick="endCall()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold text-[11px] tracking-wider transition active:scale-95">

  <!-- ================= SCREEN 3: SMART BROWSER WARNING OVERLAY ================= -->
  <div id="warningScreen" class="hidden flex-1 flex flex-col justify-center items-center max-w-sm mx-auto space-y-6 text-center px-2">
    <div class="text-center">
      <span class="text-5xl">⚠️</span>
      <h1 class="text-2xl font-bold text-teal-400 mt-3 font-mono">PORTAL BLOCK</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Action Required</p>
    </div>

    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-2xl space-y-6">
      <div id="warningText" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line">
        <!-- Dynamically Filled -->
      </div>
      
      <button onclick="copyCurrentLink()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 rounded-lg font-bold text-xs tracking-wider shadow-lg transition">
        📋 COPY LINK TO CLIPBOARD
      </button>

  </div>

  <script>
    // ====== RE-ROUTE TO TALK TO YOUR GOOGLE BACKEND OVER API ======
    const BACKEND_API_URL = "https://script.google.com/macros/s/AKfycbzbDwf_gCPgNZTp5-R1l3zcZgudaBNqVVvO_BmF9WFFMPgOwUlvSpCjKUkdFHqE_CGP/exec"; 
    // ==============================================================

    const CAL_FREE_LINK = "https://cal.id/rac-forge/15-minutes-free-call";
    const CAL_PAID_LINK = "https://cal.id/rac-forge/30-minutes-paid-call";

    let isCalling = false;
    let isListening = false;  
    let isProcessing = false; 
    let recognition;
    let audioCtx;
    let ringInterval;
    let callTimerInterval;
    let startTime;
    let silenceTimeout;
    let warningTimeout;
    let activeUtterance; 
    let audioPlayer = new Audio();
    let audioQueue = [];
    let isSpeakingCloud = false;

    let userName = "";
    let userPhone = "";
    let selectedLang = "Hinglish"; // Defaults to Hinglish

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Dialer Functions & Long Press 0 Configuration
    let zeroTimer;
    let isLongPress = false;
    const btnZero = document.getElementById("btnZero");

    function dialNum(val) {
      document.getElementById("userPhone").value += val;
    }
    function backspace() {
      const display = document.getElementById("userPhone");
      display.value = display.value.slice(0, -1);
    }
    function clearDialer() {
      document.getElementById("userPhone").value = "";
    }

    function startZeroPress() {
      isLongPress = false;
      zeroTimer = setTimeout(() => {
        isLongPress = true;
        dialNum('+');
      }, 600); // 600ms hold triggers '+'
    }
    function endZeroPress() {
      clearTimeout(zeroTimer);
      if (!isLongPress) {
        dialNum('0');
      }
    }

    // Attach native touch & mouse events for Long-Press 0
    btnZero.addEventListener("mousedown", startZeroPress);
    btnZero.addEventListener("mouseup", endZeroPress);
    btnZero.addEventListener("touchstart", (e) => { e.preventDefault(); startZeroPress(); });
    btnZero.addEventListener("touchend", (e) => { e.preventDefault(); endZeroPress(); });

    function checkBrowserCompatibility() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      const isWhatsApp = ua.indexOf("WhatsApp") > -1;
      const isCrios = ua.indexOf("CriOS") > -1; 
      const isFxiOS = ua.indexOf("FxiOS") > -1; 
      
      let incompatible = false;
      let instructionMessage = "";
      
      if (isWhatsApp) {
        incompatible = true;
        instructionMessage = "🔒 *In-App Browser Detected*\n\nWhatsApp's built-in browser blocks device microphone access for your security.\n\nPlease click the button below to copy the link, then open your phone's standard browser and paste it to connect:\n\n👉 *Google Chrome* (if on Android)\n👉 *Safari* (if on iPhone)";
      } else if (isIOS && (isCrios || isFxiOS)) {
        incompatible = true;
        instructionMessage = "🔒 *Safari Required*\n\nApple does not support speech recognition inside third-party browsers like Chrome or Firefox on iOS.\n\nPlease copy this link, open **Safari** directly on your iPhone, and paste it to connect!";
      } else if (!SpeechRecognition) {
        incompatible = true;
        instructionMessage = "🔒 *Browser Not Supported*\n\nYour current browser does not support real-time speech recognition.\n\nPlease open this link directly in **Google Chrome** or **Safari** to connect with RAAAHI.";
      }
      
      if (incompatible) {
        document.getElementById("onboardingScreen").classList.add("hidden");
        document.getElementById("warningScreen").classList.remove("hidden");
        document.getElementById("warningText").innerText = instructionMessage;

        const headerBrandText = document.getElementById("headerBrandText");
        const exitHomeBtn = document.getElementById("exitHomeBtn");
        if (headerBrandText) {
          headerBrandText.classList.remove("text-teal-600");
          headerBrandText.classList.add("text-teal-400");
        }
        if (exitHomeBtn) {
          exitHomeBtn.classList.remove("bg-white", "text-slate-700", "border-slate-200");
          exitHomeBtn.classList.add("bg-slate-900", "text-slate-300", "border-slate-800", "hover:bg-slate-800", "hover:text-white");
        }
      }
    }

    function copyCurrentLink() {
      const dummyInput = document.createElement('textarea');
      dummyInput.value = window.location.href; 
      document.body.appendChild(dummyInput);
      dummyInput.select();
      document.execCommand('copy');
      document.body.removeChild(dummyInput);
      alert("Custom link copied successfully! Now open your native browser (Chrome or Safari) and paste it.");
    }

    function startOnboardingCall() {
      userName = document.getElementById("userName").value.trim();
      userPhone = document.getElementById("userPhone").value.trim();

      if (!userName) {
        alert("Please enter your name.");
        return;
      }
      if (!userPhone || userPhone.length < 10) {
        alert("Please enter your 10-digit WhatsApp phone number using the dial pad.");
        return;
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            stream.getTracks().forEach(track => track.stop());

            document.getElementById("onboardingScreen").classList.add("hidden");
            document.getElementById("callScreen").classList.remove("hidden");
            document.getElementById("callScreen").classList.add("flex");
            document.getElementById("callerNameDisp").innerText = "RAC FORGE ADVISOR";

            const headerBrandText = document.getElementById("headerBrandText");
            const exitHomeBtn = document.getElementById("exitHomeBtn");
            if (headerBrandText) {
              headerBrandText.classList.remove("text-teal-600");
              headerBrandText.classList.add("text-teal-400");
            }
            if (exitHomeBtn) {
              exitHomeBtn.classList.remove("bg-white", "text-slate-700", "border-slate-200");
              exitHomeBtn.classList.add("bg-slate-900", "text-slate-300", "border-slate-800", "hover:bg-slate-800", "hover:text-white");
            }

            startCall();
          })
          .catch(function(err) {
            alert("Microphone permission was denied. ⚠️ Please click 'Allow' in your address bar so RAAAHI can hear you!");
          });
      } else {
        alert("Unable to access microphone devices on this browser. Please use Google Chrome or Safari.");
      }
    }

    function playRingbackTone() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      function playTone() {
        if (!isCalling || document.getElementById("callStatus").innerText !== "DIALING...") return;
        
        let osc1 = audioCtx.createOscillator();
        let osc2 = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        
        osc1.frequency.value = 400; 
        osc2.frequency.value = 450;
        
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
        
        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        
        setTimeout(() => {
          osc1.stop();
          osc2.stop();
        }, 1500); 
      }
      
      playTone();
      ringInterval = setInterval(playTone, 4000); 
    }

    function startCall() {
      isCalling = true;
      synth.cancel();
      playRingbackTone();

      // EXACT 5 SECOND DIALING CADENCE
      setTimeout(() => {
        if (!isCalling) return;
        clearInterval(ringInterval);
        
        document.getElementById("callStatus").innerText = "CONNECTING...";
        
        // 1 SECOND SILENT GAP BEFORE THE CALL IS ESTABLISHED DIRECTLY
        setTimeout(() => {
          if (!isCalling) return;
          
          // Directly trigger call activation using the default language (Hinglish)
          confirmIvrLanguage(selectedLang);
        }, 1000);
      }, 5000);
    }

    function confirmIvrLanguage(lang) {
      if (!isCalling) return;
      document.onkeydown = null; // Unbind keyboard listener
      
      selectedLang = lang;
      
      // Complete IVR Selection
      document.getElementById("micBtn").classList.remove("bg-teal-800", "border-teal-700");
      document.getElementById("micBtn").classList.add("voice-pulse", "bg-teal-600", "border-teal-400");
      document.getElementById("micIcon").innerText = "🟢";
      document.getElementById("callTimer").classList.remove("hidden");
      
      startTimer();
      
      // Beep sound confirmation
      playBeepAndStartAI();
    }

    function playBeepAndStartAI() {
      if (!isCalling) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        osc.frequency.value = 800;
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        setTimeout(() => {
          try { osc.stop(); } catch(e) {}
        }, 300);
      } catch (e) {
        console.warn("Could not play beep:", e);
      }
      
      setTimeout(() => {
        // Connect the conversational greetings based on selected language
        let greeting = "";
        if (selectedLang === "Hinglish") {
          greeting = `Greetings ${userName}! मैं राही हूँ, आरएसी फोर्ज में आपकी dedicated regulatory intelligence advisor. मैं आपकी मेडिकल डिवाइस या आईवीडी compliance की यात्रा में क्या सहायता कर सकती हूँ?`;
        } else {
          greeting = `Greetings ${userName}! I am RAAAHI, your dedicated regulatory intelligence advisor at RAC Forge Private Limited. How can I assist you with your medical device or IVD compliance journey today?`;
        }
        
        // Start the continuous conversational AI loop
        initSpeechRecognition();
        speakTextCloud(greeting, selectedLang === "Hinglish" ? "en-IN" : "en-IN");
      }, 300);
    }

    function startTimer() {
      startTime = Date.now();
      callTimerInterval = setInterval(() => {
        const diff = Date.now() - startTime;
        const mins = Math.floor(diff / 60000).toString().padStart(2, '0');
        const secs = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById("callTimer").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function initSpeechRecognition() {
      if (!SpeechRecognition) return;
      
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-IN'; 
      
      recognition.onresult = function(event) {
        clearTimeouts();
        stopListening(); 
        isProcessing = true;
        
        const transcript = event.results[0][0].transcript;
        document.getElementById("transcriptText").innerText = '"' + transcript + '"';
        document.getElementById("callStatus").innerText = "Processing...";
        
        var url = BACKEND_API_URL + "?action=callGemini" + 
                  "&phone=" + encodeURIComponent(userPhone) + 
                  "&text=" + encodeURIComponent(transcript + " [Please reply strictly in conversational " + selectedLang + " style]");
        
        fetch(url)
        .then(response => response.json())
        .then(data => {
          isProcessing = false;
          document.getElementById("callStatus").innerText = "RAAAHI is speaking...";
          speakTextCloud(data.reply, selectedLang === "Hinglish" ? "en-IN" : "en-IN");
        })
        .catch(err => {
          isProcessing = false;
          speakTextCloud("Connection error. Please speak again.", "en-IN");
        });
      };

      recognition.onend = function() {
        isListening = false;
        // Microphone strictly ONLY reactivates if RAAAHI has completely finished her cloud speech!
        if (isCalling && !isProcessing && !isSpeakingCloud) {
          startListening();
        }
      };

      recognition.onerror = function() {
        isListening = false;
        if (isCalling && !isProcessing && !isSpeakingCloud) {
          startListening();
        }
      };
    }

    function startListening() {
      if (!isCalling || isListening || isProcessing || isSpeakingCloud) return;
      document.getElementById("callStatus").innerText = "Listening...";
      try {
        isListening = true;
        recognition.start();
        resetInactivityTimers(); 
      } catch (e) {
        isListening = false;
      }
    }

    // CONVERSATIONAL BARGE-IN (Allows user to interrupt and speak)
    function triggerBargeIn() {
      if (!isCalling) return;
      
      if (isSpeakingCloud || isProcessing) {
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch(e) {}
        }
        audioPlayer.pause();       // Instantly stops RAAAHI's cloud voice
        isSpeakingCloud = false;
        isProcessing = false; 
        document.getElementById("interruptBtn").classList.add("hidden");
        startListening();     // Instantly starts listening to user
      }
    }

    // NATIVE INDIAN CLOUD-SPEECH SYNTHESIS ENGINE (Bypasses local robotic voices!)
    function speakTextCloud(text, langCode) {
      clearTimeouts();
      stopListening(); // STRICT REQ: Turn off microphone while RAAAHI speaks! (Prevents feedback echo loops)
      
      audioPlayer.pause();
      audioQueue = [];
      
      // Unicode Regex strips all emojis completely from voice logs to keep transcripts pristine
      const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F1E6}-\u{1F1FF}\u{1F191}-\u{1F251}\u{1F004}\u{1F0CF}\u{1F170}-\u{1F171}\u{1F17E}-\u{1F17F}\u{1F18E}\u{3030}\u{2B50}\u{2B55}\u{2934}-\u{2935}\u{2B05}-\u{2B07}\u{2194}-\u{2199}\u{21a9}-\u{21aa}\u{3297}\u{3299}\u{303D}\u{2139}\u{24C2}\u{1F190}\u{1F192}-\u{1F19A}\u{1F1E6}-\u{1F1FF}]/gu;
      const cleanText = text.replace(emojiRegex, "").replace(/\*/g, "").trim();
      
      // Use window.speechSynthesis as the primary, highly reliable native engine
      if (window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
          
          const utterance = new SpeechSynthesisUtterance(cleanText);
          const voices = window.speechSynthesis.getVoices();
          let selectedVoice = null;
          
          if (langCode === "Hinglish" || selectedLang === "Hinglish") {
            selectedVoice = voices.find(v => v.lang.includes("hi-IN")) || 
                             voices.find(v => v.lang.includes("en-IN")) || 
                             voices.find(v => v.lang.includes("en-GB")) || 
                             voices.find(v => v.lang.includes("en"));
            utterance.lang = selectedVoice ? selectedVoice.lang : "hi-IN";
          } else {
            selectedVoice = voices.find(v => v.lang.includes("en-IN")) || 
                             voices.find(v => v.lang.includes("en-GB")) || 
                             voices.find(v => v.lang.includes("en-US")) || 
                             voices.find(v => v.lang.includes("en"));
            utterance.lang = selectedVoice ? selectedVoice.lang : "en-IN";
          }
          
          if (selectedVoice) {
            utterance.voice = selectedVoice;
          }
          
          utterance.rate = 0.95;
          utterance.pitch = 1.0;
          
          isSpeakingCloud = true;
          document.getElementById("callStatus").innerText = "RAAAHI is speaking...";
          document.getElementById("interruptBtn").classList.remove("hidden");
          
          utterance.onend = function() {
            isSpeakingCloud = false;
            document.getElementById("interruptBtn").classList.add("hidden");
            if (isCalling) {
              startListening();
            }
          };
          
          utterance.onerror = function(event) {
            console.warn("SpeechSynthesis error, falling back to Google TTS:", event);
            fallbackToGoogleTTS(cleanText, langCode);
          };
          
          window.speechSynthesis.speak(utterance);
          return;
        } catch (err) {
          console.warn("SpeechSynthesis catch error, falling back to Google TTS:", err);
        }
      }
      
      fallbackToGoogleTTS(cleanText, langCode);
    }

    function fallbackToGoogleTTS(cleanText, langCode) {
      audioPlayer.pause();
      audioQueue = [];
      
      const sentences = cleanText.match(/[^.!?]+[.!?]*/g) || [cleanText];
      
      sentences.forEach(sentence => {
        let trimmed = sentence.trim();
        if (trimmed.length > 0) {
          while (trimmed.length > 150) {
            audioQueue.push(trimmed.substring(0, 150));
            trimmed = trimmed.substring(150);
          }
          audioQueue.push(trimmed);
        }
      });
      
      isSpeakingCloud = true;
      document.getElementById("callStatus").innerText = "RAAAHI is speaking...";
      document.getElementById("interruptBtn").classList.remove("hidden");
      
      playNextAudioChunk(langCode === "Hinglish" ? "en-IN" : "en-IN");
    }

    function playNextAudioChunk(langCode) {
      if (audioQueue.length === 0) {
        isSpeakingCloud = false;
        document.getElementById("interruptBtn").classList.add("hidden");
        if (isCalling) {
          startListening(); // Microphone turns back on safely only after speech ends!
        }
        return;
      }
      
      let chunk = audioQueue.shift();
      // Fetches natural, human-sounding cloud audio streams (100% free, 0 ads)
      let url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + langCode + "&q=" + encodeURIComponent(chunk);
      
      audioPlayer.src = url;
      
      audioPlayer.onerror = function() {
        console.warn("Audio player chunk load failure, skipping to next chunk...");
        playNextAudioChunk(langCode);
      };

      audioPlayer.play().catch(e => {
        console.warn("Audio player play rejection, skipping to next chunk:", e);
        playNextAudioChunk(langCode);
      });
      
      audioPlayer.onended = function() {
        playNextAudioChunk(langCode);
      };
    }

    function resetInactivityTimers() {
      clearTimeouts();
      
      silenceTimeout = setTimeout(() => {
        if (!isCalling) return;
        stopListening();
        speakTextCloud("Are you still there? I haven't heard anything from you. Please let me know if you would like me to send our expert booking links to your WhatsApp.", selectedLang === "Hinglish" ? "en-IN" : "en-IN");
        
        warningTimeout = setTimeout(() => {
          if (!isCalling) return;
          speakTextCloud("Since I still haven't heard anything, I have successfully sent our expert booking links directly to your WhatsApp. Have a wonderful day, goodbye!", selectedLang === "Hinglish" ? "en-IN" : "en-IN");
          
          setTimeout(() => {
            triggerWhatsAppLogs();
            endCall();
          }, 6000); 
        }, 15000);
      }, 15000);
    }

    function clearTimeouts() {
      clearTimeout(silenceTimeout);
      clearTimeout(warningTimeout);
    }

    function triggerWhatsAppLogs() {
      var url = BACKEND_API_URL + "?action=sendAgentMessage" + 
                "&phone=" + encodeURIComponent(userPhone) + 
                "&text=" + encodeURIComponent(`🩺 *RAC Forge Consultation Links* \n\nHello *${userName}*! As requested during our voice session, here are the links to schedule your meeting with our team: \n\n🌟 *Free 15-Minute Call* (Basic guidance): ${CAL_FREE_LINK} \n\n💎 *Paid 30-Minute Call* (Deep-dive, ₹1,000): ${CAL_PAID_LINK} \n\nWe look forward to speaking with you! 😊`);
                
      fetch(url);
    }

    function endCall() {
      isCalling = false;
      isListening = false;
      isProcessing = false;
      isSpeakingCloud = false;
      clearTimeouts();
      clearInterval(ringInterval);
      clearInterval(callTimerInterval);
      
      document.getElementById("micBtn").classList.remove("voice-pulse", "bg-teal-600", "border-teal-400");
      document.getElementById("micIcon").innerText = "📞";
      document.getElementById("callStatus").innerText = "TAP MIC TO START CALL";
      document.getElementById("callTimer").classList.add("hidden");
      document.getElementById("transcriptText").innerText = "";
      document.getElementById("interruptBtn").classList.add("hidden");
      
      const headerBrandText = document.getElementById("headerBrandText");
      const exitHomeBtn = document.getElementById("exitHomeBtn");
      if (headerBrandText) {
        headerBrandText.classList.remove("text-teal-400");
        headerBrandText.classList.add("text-teal-600");
      }
      if (exitHomeBtn) {
        exitHomeBtn.classList.remove("bg-slate-900", "text-slate-300", "border-slate-800", "hover:bg-slate-800", "hover:text-white");
        exitHomeBtn.classList.add("bg-white", "text-slate-700", "border-slate-200");
      }

      synth.cancel();
      audioPlayer.pause();
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (audioCtx) audioCtx.close();

      document.getElementById("callScreen").classList.add("hidden");
      document.getElementById("onboardingScreen").classList.remove("hidden");
    }

    window.onload = function() {
      checkBrowserCompatibility(); 
    };
  </script>
