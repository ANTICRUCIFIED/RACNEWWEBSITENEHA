<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ENFORCES NATIVE 100% MOBILE SCALE (Fixes the tiny GUI issue) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAAAHI Voice Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.7); }
      50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 30px 15px rgba(13, 148, 136, 0.4); }
    }
    .voice-pulse { animation: pulse-glow 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] justify-between overflow-hidden select-none">

  <!-- ================= SCREEN 1: THE NATIVE MOBILE DIAL PAD (WHITE THEME & SCALED) ================= -->
  <div id="onboardingScreen" class="flex-1 flex flex-col justify-center items-center w-full bg-slate-50 text-slate-800 p-6 space-y-6">
    <!-- Branding Header -->
    <div class="text-center">
      <span class="text-5xl">🩺</span>
      <h1 class="text-2xl font-bold text-teal-600 mt-2 font-mono tracking-wider">RAAAHI VOICE</h1>
      <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold">RAC Forge Private Limited</p>
    </div>

    <!-- Phone Number & Name Display Screen (Scaled up for mobile) -->
    <div class="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 shadow-xl space-y-5">
      
      <div class="space-y-1">
        <label class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Your Name</label>
        <input id="userName" type="text" placeholder="ENTER YOUR NAME" class="w-full p-3.5 bg-slate-100 border border-slate-200 rounded-xl text-sm text-center text-slate-800 placeholder-slate-400 focus:outline-none focus:border-teal-500 uppercase font-semibold">
      </div>
      
      <!-- Dialer Phone Screen -->
      <div class="space-y-1">
        <input id="userPhone" type="tel" readonly placeholder="ENTER WHATSAPP NUMBER" class="w-full text-center bg-transparent text-2xl font-bold tracking-widest text-teal-600 placeholder-slate-300 focus:outline-none font-mono">
      </div>

      <!-- The Digital Dial Pad Grid (Rounded-Pill Rectangle Keys) -->
      <div class="grid grid-cols-3 gap-y-3.5 gap-x-6 max-w-[280px] mx-auto pt-2">
        <button onclick="dialNum('1')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">1</button>
        <button onclick="dialNum('2')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">2</button>
        <button onclick="dialNum('3')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">3</button>
        
        <button onclick="dialNum('4')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">4</button>
        <button onclick="dialNum('5')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">5</button>
        <button onclick="dialNum('6')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">6</button>
        
        <button onclick="dialNum('7')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">7</button>
        <button onclick="dialNum('8')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">8</button>
        <button onclick="dialNum('9')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">9</button>
        
        <button onclick="dialNum('*')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">*</button>
        <button id="btnZero" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">0</button>
        <button onclick="dialNum('#')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">#</button>
      </div>

      <!-- Dialer Control Actions -->
      <div class="flex justify-center items-center gap-6 pt-4 border-t border-slate-200">
        <button onclick="backspace()" class="w-12 h-11 rounded-xl bg-slate-100 hover:bg-slate-200 text-base flex items-center justify-center text-slate-500 transition active:scale-95 border border-slate-200">⌫</button>
        
        <!-- Wide Green Call Pill Button -->
        <button onclick="startOnboardingCall()" class="w-32 h-11 bg-emerald-600 hover:bg-emerald-500 rounded-full flex items-center justify-center gap-2 font-semibold text-sm tracking-wide text-white transition active:scale-95 shadow-md">
          <span>📞</span>
          <span>Call</span>
        </button>
        
        <button onclick="clearDialer()" class="w-12 h-11 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm font-bold flex items-center justify-center text-rose-500 transition active:scale-95 border border-slate-200">C</button>
      </div>
    </div>
  </div>

  <!-- ================= SCREEN 2: ACTIVE CALLER SCREEN ================= -->
  <div id="callScreen" class="hidden flex-1 flex flex-col justify-between h-full w-full max-w-sm mx-auto px-4 py-6">
    <!-- Header info -->
    <div class="text-center mt-2">
      <h1 id="callerNameDisp" class="text-xl md:text-2xl font-bold text-teal-400 tracking-wide font-mono">
        RAAAHI VOICE
      </h1>
      <p id="callStatus" class="text-[10px] md:text-xs text-slate-400 mt-1 uppercase tracking-widest">DIALING...</p>
      <p id="callTimer" class="hidden text-xs md:text-sm text-slate-500 mt-1 font-mono">00:00</p>
    </div>

    <!-- Pulsing active call visualizer -->
    <div class="flex-1 flex flex-col items-center justify-center">
      <div id="micBtn" onclick="toggleCall()" class="w-28 h-28 md:w-32 md:h-32 rounded-full bg-slate-800 border-4 border-slate-700 flex items-center justify-center transition shadow-lg cursor-pointer">
        <span id="micIcon" class="text-4xl md:text-5xl">📞</span>
      </div>

      <!-- RED BARGE-IN / INTERRUPT BUTTON (Only displays when RAAAHI is speaking) -->
      <button id="interruptBtn" onclick="triggerBargeIn()" class="hidden w-full max-w-[200px] mt-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-full transition shadow-md animate-bounce">
        🛑 Tap to Interrupt RAAAHI
      </button>

      <p id="transcriptText" class="text-xs md:text-sm italic text-slate-400 max-w-xs text-center mt-6 md:mt-8 min-h-[40px] px-4"></p>
    </div>

    <!-- Active Call Footer Actions -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl mb-2 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <a href="https://cal.com/rac-forge-ulicvs/15min" target="_blank" class="p-2.5 bg-slate-800 hover:bg-slate-750 text-center rounded-lg text-[11px] font-bold transition">🌟 Free 15-Min</a>
        <a href="https://cal.com/rac-forge-ulicvs/30min" target="_blank" class="p-2.5 bg-teal-900/40 hover:bg-teal-900/60 border border-teal-800 text-center rounded-lg text-[11px] font-bold text-teal-300 transition">💎 Paid 30-Min</a>
      </div>

      <!-- Large Red Hangup Button -->
      <button onclick="endCall()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold text-[11px] tracking-wider transition active:scale-95">
        🚨 HANG UP CALL
      </button>
    </div>
  </div>

  <!-- ================= SCREEN 3: SMART BROWSER WARNING OVERLAY ================= -->
  <div id="warningScreen" class="hidden flex-1 flex flex-col justify-center items-center max-w-sm mx-auto space-y-6 text-center px-2">
    <div class="text-center">
      <span class="text-5xl">⚠️</span>
      <h1 class="text-2xl font-bold text-teal-400 mt-3 font-mono">PORTAL BLOCK</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Action Required</p>
    </div>

    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-2xl space-y-6">
      <div id="warningText" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line">
        <!-- Dynamically Filled -->
      </div>
      
      <button onclick="copyCurrentLink()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 rounded-lg font-bold text-xs tracking-wider shadow-lg transition">
        📋 COPY LINK TO CLIPBOARD
      </button>
    </div>
  </div>

  <script>
    // ====== RE-ROUTE TO TALK TO YOUR GOOGLE BACKEND OVER API ======
    const BACKEND_API_URL = "https://script.google.com/macros/s/AKfycbx-JJYSDcjVPDTQJCU7lIs0ka0hVZr4_BYSf_cGWEH0qAsaHm2291RrY7ajMTWfpP23/exec"; 
    // ==============================================================

    let isCalling = false;
    let isListening = false;  
    let isProcessing = false; 
    let recognition;
    let audioCtx;
    let ringInterval;
    let callTimerInterval;
    let startTime;
    let silenceTimeout;
    let warningTimeout;
    let activeUtterance; // Saved globally to prevent browser garbage collection
    let audioPlayer = new Audio();
    let audioQueue = [];
    let isSpeakingCloud = false;
    let ringCount = 0; 

    let userName = "";
    let userPhone = "";
    const selectedLang = "Hinglish"; // Defaults strictly to Hinglish

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Dialer Functions & Long Press 0 Configuration
    let zeroTimer;
    let isLongPress = false;
    const btnZero = document.getElementById("btnZero");

    function dialNum(val) {
      document.getElementById("userPhone").value += val;
    }
    function backspace() {
      const display = document.getElementById("userPhone");
      display.value = display.value.slice(0, -1);
    }
    function clearDialer() {
      document.getElementById("userPhone").value = "";
    }

    function startZeroPress() {
      isLongPress = false;
      zeroTimer = setTimeout(() => {
        isLongPress = true;
        dialNum('+');
      }, 600); 
    }
    function endZeroPress() {
      clearTimeout(zeroTimer);
      if (!isLongPress) {
        dialNum('0');
      }
    }

    // Attach native touch & mouse events for Long-Press 0
    btnZero.addEventListener("mousedown", startZeroPress);
    btnZero.addEventListener("mouseup", endZeroPress);
    btnZero.addEventListener("touchstart", (e) => { e.preventDefault(); startZeroPress(); });
    btnZero.addEventListener("touchend", (e) => { e.preventDefault(); endZeroPress(); });

      const isWhatsApp = ua.indexOf("WhatsApp") > -1;
      const isCrios = ua.indexOf("CriOS") > -1;

      } else if (!SpeechRecognition) {
        incompatible = true;
        instructionMessage = "🔒 *Browser Not Supported*\n\nYour current browser does not support real-time speech recognition.\n\nPlease open this link directly in **Google Chrome** or **Safari** to connect with RAAAHI.";
      }
      
      if (incompatible) {
        document.getElementById("onboardingScreen").classList.add("hidden");
        document.getElementById("warningScreen").classList.remove("hidden");
        document.getElementById("warningText").innerText = instructionMessage;
      }
    }

    function copyCurrentLink() {
      const dummyInput = document.createElement('textarea');
      dummyInput.value = "https://www.racforge.com/voice.html"; 
      document.body.appendChild(dummyInput);
      dummyInput.select();
      document.execCommand('copy');
      document.body.removeChild(dummyInput);
      alert("Custom link copied successfully! Now open your native browser (Chrome or Safari) and paste it.");
    }

      userPhone = document.getElementById("userPhone").value.trim();

        alert("Please enter your name.");
        return;
      }
