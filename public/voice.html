<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ENFORCES NATIVE 100% MOBILE SCALE (Fixes the tiny GUI issue) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAAAHI Voice Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.7); }
      50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 30px 15px rgba(13, 148, 136, 0.4); }
    }
    .voice-pulse { animation: pulse-glow 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] justify-between overflow-hidden select-none">

  <!-- ================= SCREEN 1: THE NATIVE MOBILE DIAL PAD (CLEAN WHITE THEME) ================= -->
  <div id="onboardingScreen" class="flex-1 flex flex-col justify-center items-center w-full bg-slate-50 text-slate-800 p-6 space-y-6">
    <!-- Branding Header -->
    <div class="text-center">
      <span class="text-5xl">🩺</span>
      <h1 class="text-2xl font-bold text-teal-600 mt-2 font-mono tracking-wider">RAAAHI VOICE</h1>
      <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold">RAC Forge Private Limited</p>
    </div>

    <!-- Phone Number & Name Display Screen -->
    <div class="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 shadow-xl space-y-4">
      
      <!-- Name Input -->
      <div class="space-y-1">
        <label class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Your Name</label>
        <input id="userName" type="text" placeholder="ENTER YOUR NAME" class="w-full p-3.5 bg-slate-100 border border-slate-200 rounded-xl text-sm text-center text-slate-800 placeholder-slate-400 focus:outline-none focus:border-teal-500 uppercase font-semibold">
      </div>
      
      <!-- Dialer Phone Screen -->
      <div class="space-y-1">
        <input id="userPhone" type="tel" readonly placeholder="ENTER WHATSAPP NUMBER" class="w-full text-center bg-transparent text-2xl font-bold tracking-widest text-teal-600 placeholder-slate-300 focus:outline-none font-mono">
      </div>

      <!-- The Digital Dial Pad Grid (Rounded-Pill Rectangle Keys) -->
      <div class="grid grid-cols-3 gap-y-3.5 gap-x-6 max-w-[280px] mx-auto pt-2">
        <button onclick="dialNum('1')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">1</button>
        <button onclick="dialNum('2')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">2</button>
        <button onclick="dialNum('3')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">3</button>
        
        <button onclick="dialNum('4')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">4</button>
        <button onclick="dialNum('5')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">5</button>
        <button onclick="dialNum('6')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">6</button>
        
        <button onclick="dialNum('7')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">7</button>
        <button onclick="dialNum('8')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">8</button>
        <button onclick="dialNum('9')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">9</button>
        
        <button onclick="dialNum('*')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">*</button>
        <button onclick="dialNum('0')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">0</button>
        <button onclick="dialNum('#')" class="w-20 h-12 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xl font-bold flex items-center justify-center rounded-2xl transition active:scale-95 shadow-sm border border-slate-200">#</button>
      </div>

      <!-- Dialer Control Actions (Wide Green Call Pill) -->
      <div class="flex justify-center items-center gap-6 pt-4 border-t border-slate-200">
        <button onclick="backspace()" class="w-12 h-11 rounded-xl bg-slate-100 hover:bg-slate-200 text-base flex items-center justify-center text-slate-500 transition active:scale-95 border border-slate-200">⌫</button>
        
        <button onclick="startOnboardingCall()" class="w-32 h-11 bg-emerald-600 hover:bg-emerald-500 rounded-full flex items-center justify-center gap-2 font-semibold text-sm tracking-wide text-white transition active:scale-95 shadow-md">
          <span>📞</span>
          <span>Call</span>
        </button>
        
        <button onclick="clearDialer()" class="w-12 h-11 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm font-bold flex items-center justify-center text-rose-500 transition active:scale-95 border border-slate-200">C</button>
      </div>
    </div>
  </div>

  <!-- ================= SCREEN 2: ACTIVE CALLER SCREEN ================= -->
  <div id="callScreen" class="hidden flex-1 flex flex-col justify-between h-full w-full max-w-sm mx-auto px-4 py-6">
    <!-- Header info -->
    <div class="text-center mt-2">
      <h1 id="callerNameDisp" class="text-xl md:text-2xl font-bold text-teal-400 tracking-wide font-mono">
        RAAAHI VOICE
      </h1>
      <p id="callStatus" class="text-[10px] md:text-xs text-slate-400 mt-1 uppercase tracking-widest">DIALING...</p>
      <p id="callTimer" class="hidden text-xs md:text-sm text-slate-500 mt-1 font-mono">00:00</p>
    </div>

    <!-- Pulsing active call visualizer -->
    <div class="flex-1 flex flex-col items-center justify-center">
      <div id="micBtn" onclick="toggleCall()" class="w-28 h-28 md:w-32 md:h-32 rounded-full bg-slate-800 border-4 border-slate-700 flex items-center justify-center transition shadow-lg cursor-pointer">
        <span id="micIcon" class="text-4xl md:text-5xl">📞</span>
      </div>
      <p id="transcriptText" class="text-xs md:text-sm italic text-slate-400 max-w-xs text-center mt-6 md:mt-8 min-h-[40px] px-4"></p>
    </div>

    <!-- Active Call Footer Actions -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl mb-2 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <a href="https://cal.com/rac-forge-ulicvs/15min" target="_blank" class="p-2.5 bg-slate-800 hover:bg-slate-750 text-center rounded-lg text-[11px] font-bold transition">🌟 Free 15-Min</a>
        <a href="https://cal.com/rac-forge-ulicvs/30min" target="_blank" class="p-2.5 bg-teal-900/40 hover:bg-teal-900/60 border border-teal-800 text-center rounded-lg text-[11px] font-bold text-teal-300 transition">💎 Paid 30-Min</a>
      </div>

      <!-- Large Red Hangup Button -->
      <button onclick="endCall()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold text-[11px] tracking-wider transition active:scale-95">
        🚨 HANG UP CALL
      </button>
    </div>
  </div>

  <!-- ================= SCREEN 3: SMART BROWSER WARNING OVERLAY ================= -->
  <div id="warningScreen" class="hidden flex-1 flex flex-col justify-center items-center max-w-sm mx-auto space-y-6 text-center px-2">
    <div class="text-center">
      <span class="text-5xl">⚠️</span>
      <h1 class="text-2xl font-bold text-teal-400 mt-3 font-mono">PORTAL BLOCK</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Action Required</p>
    </div>

    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-2xl space-y-6">
      <div id="warningText" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line">
        <!-- Dynamically Filled -->
      </div>
      
      <button onclick="copyCurrentLink()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 rounded-lg font-bold text-xs tracking-wider shadow-lg transition">
        📋 COPY LINK TO CLIPBOARD
      </button>
    </div>
  </div>

  <script>
    // ====== RE-ROUTE TO TALK TO YOUR GOOGLE BACKEND OVER API ======
    const BACKEND_API_URL = "https://script.google.com/macros/s/AKfycbzbDwf_gCPgNZTp5-R1I3zcZgudaBNqVVvO_BmF9WFFMPgOwUlvSpCjKUkdFHqE_CGP/exec"; 
    // ==============================================================

    let isCalling = false;
    let isListening = false;  
    let isProcessing = false; 
    let recognition;
    let audioCtx;
    let ringInterval;
    let callTimerInterval;
    let startTime;
    let silenceTimeout;
    let warningTimeout;
    let activeUtterance; // Saved globally to prevent browser garbage collection

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Dialer Functions
    function dialNum(val) {
      const display = document.getElementById("userPhone");
      display.value += val;
    }

    function backspace() {
      const display = document.getElementById("userPhone");
      display.value = display.value.slice(0, -1);
    }

    function clearDialer() {
      document.getElementById("userPhone").value = "";
    }

    function checkBrowserCompatibility() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      const isWhatsApp = ua.indexOf("WhatsApp") > -1;
      const isCrios = ua.indexOf("CriOS") > -1; 
      const isFxiOS = ua.indexOf("FxiOS") > -1; 
      
      let incompatible = false;
      let instructionMessage = "";
      
      if (isWhatsApp) {
        incompatible = true;
        instructionMessage = "🔒 *In-App Browser Detected*\n\nWhatsApp's built-in browser blocks device microphone access for your security.\n\nPlease click the button below to copy the link, then open your phone's standard browser and paste it to connect:\n\n👉 *Google Chrome* (if on Android)\n👉 *Safari* (if on iPhone)";
      } else if (isIOS && (isCrios || isFxiOS)) {
        incompatible = true;
        instructionMessage = "🔒 *Safari Required*\n\nApple does not support speech recognition inside third-party browsers like Chrome or Firefox on iOS.\n\nPlease copy this link, open **Safari** directly on your iPhone, and paste it to connect!";
      } else if (!SpeechRecognition) {
        incompatible = true;
        instructionMessage = "🔒 *Browser Not Supported*\n\nYour current browser does not support real-time speech recognition.\n\nPlease open this link directly in **Google Chrome** or **Safari** to connect with RAAAHI.";
      }
      
      if (incompatible) {
        document.getElementById("onboardingScreen").classList.add("hidden");
        document.getElementById("warningScreen").classList.remove("hidden");
        document.getElementById("warningText").innerText = instructionMessage;
      }
    }

    function copyCurrentLink() {
      const dummyInput = document.createElement('textarea');
      dummyInput.value = "https://www.racforge.com/voice.html"; 
      document.body.appendChild(dummyInput);
      dummyInput.select();
      document.execCommand('copy');
      document.body.removeChild(dummyInput);
      alert("Custom link copied successfully! Now open your native browser (Chrome or Safari) and paste it.");
    }

    function startOnboardingCall() {
      userName = document.getElementById("userName").value.trim();
      userPhone = document.getElementById("userPhone").value.trim();

      if (!userName) {
        alert("Please enter your name.");
        return;
      }
      if (!userPhone || userPhone.length < 10) {
        alert("Please enter your 10-digit WhatsApp phone number using the dial pad.");
        return;
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            stream.getTracks().forEach(track => track.stop());

            document.getElementById("onboardingScreen").classList.add("hidden");
            document.getElementById("callScreen").classList.remove("hidden");
            document.getElementById("callScreen").classList.add("flex");
            document.getElementById("callerNameDisp").innerText = "RAC FORGE ADVISOR";

            startCall();
          })
          .catch(function(err) {
            alert("Microphone permission was denied. ⚠️ Please click 'Allow' in your address bar so RAAAHI can hear you!");
          });
      } else {
        alert("Unable to access microphone devices on this browser. Please use Google Chrome or Safari.");
      }
    }

    function playRingbackTone() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      function playTone() {
        if (!isCalling || document.getElementById("callStatus").innerText !== "DIALING...") return;
        
        let osc1 = audioCtx.createOscillator();
        let osc2 = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        
        osc1.frequency.value = 400; 
        osc2.frequency.value = 450;
        
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
        
        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        
        setTimeout(() => {
          osc1.stop();
          osc2.stop();
        }, 1500); 
      }
      
      playTone();
      ringInterval = setInterval(playTone, 4000); 
    }

    function startCall() {
      isCalling = true;
      synth.cancel();
      playRingbackTone();

      // EXACT 5 SECOND DIALING CADENCE
      setTimeout(() => {
        if (!isCalling) return;
        clearInterval(ringInterval);
        
        document.getElementById("callStatus").innerText = "CONNECTING...";
        
        // 1 SECOND SILENT GAP BEFORE GREETING CONNECTS
        setTimeout(() => {
          if (!isCalling) return;
          document.getElementById("callStatus").innerText = "RAAAHI is speaking...";
          document.getElementById("callTimer").classList.remove("hidden");
          document.getElementById("micBtn").classList.add("voice-pulse", "bg-teal-600", "border-teal-400");
          document.getElementById("micIcon").innerText = "🟢";
          
          startTimer();

          // Conversational Hinglish Greeting by Default
          const greeting = `Greetings ${userName}! मैं राही हूँ, आरएसी फोर्ज में आपकी dedicated regulatory intelligence advisor. मैं आपकी मेडिकल डिवाइस या आईवीडी compliance की यात्रा में क्या सहायता कर सकती हूँ?`;
          
          speakText(greeting);
        }, 1000);
      }, 5000);
    }

    function startTimer() {
      startTime = Date.now();
      callTimerInterval = setInterval(() => {
        const diff = Date.now() - startTime;
        const mins = Math.floor(diff / 60000).toString().padStart(2, '0');
        const secs = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById("callTimer").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function initSpeechRecognition() {
      if (!SpeechRecognition) return;
      
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-IN'; 
      
      recognition.onresult = function(event) {
        clearTimeouts();
        
        // CONVERSATIONAL BARGE-IN: If RAAAHI is speaking, user speech instantly silences her!
        if (synth.speaking || isProcessing) {
          synth.cancel(); 
          isProcessing = false;
        }
        
        stopListening(); 
        isProcessing = true;
        
        const transcript = event.results[0][0].transcript;
        document.getElementById("transcriptText").innerText = '"' + transcript + '"';
        document.getElementById("callStatus").innerText = "Processing...";
        
        // Instructs Gemini dynamically to respond in Hinglish (Hindi-English mix)
        var url = BACKEND_API_URL + "?action=callGemini" + 
                  "&phone=" + encodeURIComponent(userPhone) + 
                  "&text=" + encodeURIComponent(transcript + " [Please reply strictly in conversational Hinglish style]");
        
        fetch(url)
        .then(response => response.json())
        .then(data => {
          isProcessing = false;
          document.getElementById("callStatus").innerText = "RAAAHI is speaking...";
          speakText(data.reply);
        })
        .catch(err => {
          isProcessing = false;
          speakText("Connection glitch: " + err.message);
        });
      };

      recognition.onend = function() {
        isListening = false;
        if (isCalling && !isProcessing && !synth.speaking) {
          startListening();
        }
      };

      recognition.onerror = function() {
        isListening = false;
        if (isCalling && !isProcessing && !synth.speaking) {
          startListening();
        }
      };
    }

    function startListening() {
      if (!isCalling || isListening || isProcessing || synth.speaking) return;
      document.getElementById("callStatus").innerText = "Listening...";
      try {
        isListening = true;
        recognition.start();
        resetInactivityTimers(); 
      } catch (e) {
        isListening = false;
      }
    }

    function stopListening() {
      if (!isListening) return;
      isListening = false;
      try {
        recognition.stop();
      } catch(e) {}
    }

    function toggleCall() {
      if (!isCalling) return;
      
      // Manual click fallback for barge-in
      if (synth.speaking || isProcessing) {
        synth.cancel();       
        isProcessing = false; 
        startListening();     
      }
    }

    // SMART NATIVE INDIAN VOICE SELECTOR
    function getLatestIndianVoice() {
      const voices = synth.getVoices();
      
      // Priority 1: Indian localized English/Hindi languages
      let voice = voices.find(v => v.lang === 'en-IN' || v.lang === 'en_IN' || v.lang === 'hi-IN' || v.lang === 'hi_IN');
      if (voice) return voice;
      
      // Priority 2: Specific high-fidelity native Indian voice names (Apple / Google)
      const indianNames = ["rishi", "heera", "ravi", "isha", "neerja", "ananya", "google india"];
      for (let name of indianNames) {
        voice = voices.find(v => v.name.toLowerCase().includes(name));
        if (voice) return voice;
      }
      
      // Priority 3: Fallback generic locale check
      voice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('en_IN') || v.lang.includes('hi-IN') || v.lang.includes('hi_IN'));
      return voice || null;
    }

    function speakText(text) {
      synth.cancel();
      clearTimeouts();
      
      // Mic is strictly turned OFF while RAAAHI is speaking to prevent self-hearing feedback
      stopListening(); 
      
      // Unicode Regex strips all emojis completely from voice output
      const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F1E6}-\u{1F1FF}\u{1F191}-\u{1F251}\u{1F004}\u{1F0CF}\u{1F170}-\u{1F171}\u{1F17E}-\u{1F17F}\u{1F18E}\u{3030}\u{2B50}\u{2B55}\u{2934}-\u{2935}\u{2B05}-\u{2B07}\u{2194}-\u{2199}\u{21a9}-\u{21aa}\u{3297}\u{3299}\u{303D}\u{2139}\u{24C2}\u{1F190}\u{1F192}-\u{1F19A}\u{1F1E6}-\u{1F1FF}]/gu;
      const cleanText = text.replace(emojiRegex, "").replace(/\*/g, ""); 
      
      document.getElementById("callStatus").innerText = "RAAAHI is speaking (Tap Mic to Interrupt)...";
      
      activeUtterance = new SpeechSynthesisUtterance(cleanText);
      activeUtterance.rate = 0.95; // Slightly slower, highly natural pace
      activeUtterance.pitch = 1.0; 
      
      // Assign the premium localized Indian voice
      const indianVoice = getLatestIndianVoice();
      if (indianVoice) activeUtterance.voice = indianVoice;
      
      activeUtterance.onend = function() {
        if (isCalling) {
          // Microphone only turns back on AFTER RAAAHI has fully finished speaking!
          startListening(); 
        }
      };
      
      synth.speak(activeUtterance);
    }

    function resetInactivityTimers() {
      clearTimeouts();
      
      silenceTimeout = setTimeout(() => {
        if (!isCalling) return;
        stopListening();
        speakText("Are you still there? I haven't heard anything from you. Please ask any questions you have, or let me know if you would like me to send our expert booking links to your WhatsApp.");
        
        warningTimeout = setTimeout(() => {
          if (!isCalling) return;
          speakText("Since I still haven't heard anything, I have successfully sent our expert booking links directly to your WhatsApp. Have a wonderful day, goodbye!");
          
          setTimeout(() => {
            triggerWhatsAppLogs();
            endCall();
          }, 6000); 
        }, 15000);
      }, 15000);
    }

    function clearTimeouts() {
      clearTimeout(silenceTimeout);
      clearTimeout(warningTimeout);
    }

    function triggerWhatsAppLogs() {
      var url = BACKEND_API_URL + "?action=sendAgentMessage" + 
                "&phone=" + encodeURIComponent(userPhone) + 
                "&text=" + encodeURIComponent(`🩺 *RAC Forge Consultation Links* \n\nHello *${userName}*! As requested during our voice session, here are the links to schedule your meeting with our team: \n\n🌟 *Free 15-Minute Call* (Basic guidance): ${CAL_FREE_LINK} \n\n💎 *Paid 30-Minute Call* (Deep-dive, ₹1,000): ${CAL_PAID_LINK} \n\nWe look forward to speaking with you! 😊`);
                
      fetch(url);
    }

    function endCall() {
      isCalling = false;
      isListening = false;
      isProcessing = false;
      clearTimeouts();
      clearInterval(ringInterval);
      clearInterval(callTimerInterval);
      
      document.getElementById("micBtn").classList.remove("voice-pulse", "bg-teal-600", "border-teal-400");
      document.getElementById("micIcon").innerText = "📞";
      document.getElementById("callStatus").innerText = "TAP MIC TO START CALL";
      document.getElementById("callTimer").classList.add("hidden");
      document.getElementById("transcriptText").innerText = "";
      
      synth.cancel();
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (audioCtx) audioCtx.close();

      document.getElementById("callScreen").classList.add("hidden");
      document.getElementById("onboardingScreen").classList.remove("hidden");
    }

    window.onload = function() {
      checkBrowserCompatibility(); 
      initSpeechRecognition();
    };
  </script>
</body>
</html>
